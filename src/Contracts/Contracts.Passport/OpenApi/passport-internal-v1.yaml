openapi: 3.0.3
info:
  title: Passport Internal API
  description: Service-to-service endpoints. Not exposed to end users.
  version: 1.0.0

servers:
  - url: /api/passport/v1

tags:
  - name: Users
    description: User profile lookup for internal services

paths:
  /users/{id}:
    get:
      operationId: getUserById
      tags:
        - Users
      summary: Получить профиль пользователя по идентификатору
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not Found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserResponse:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string

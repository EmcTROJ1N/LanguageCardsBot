services:
  cards-presentation:
    build:
      context: ../../..
      dockerfile: src/Cards/Cards.Presentation/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    container_name: cards_presentation
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      Database__ConnectionString: ${DATABASE_CONNECTION_STRING}
      RabbitMq__HostName: infra_rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Keycloak__AuthServerUrl: http://passport_keycloak:8080
      Passport__BaseUrl: http://passport_presentation:8080
    networks:
      - shared-grpc
      - infra
      - passport

  mysql:
    image: mysql:8.4
    container_name: cards_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shared-grpc

networks:
  shared-grpc:
    name: language-cards-shared
    external: true
  infra:
    name: infra
    external: true
  passport:
    name: passport
    external: true

volumes:
  mysql-data:

services:
  api-gateway:
    build:
      context: ../..
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_URLS: http://+:5050
    networks:
      - shared-grpc
      - passport

networks:
  shared-grpc:
    name: language-cards-shared
    external: true
  passport:
    name: passport
    external: true

services:
  passport-presentation:
    build:
      context: ../..
      dockerfile: src/Passport.Presentation/Dockerfile
    container_name: passport_presentation
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
    ports:
      - "${PASSPORT_HTTP_PORT:-5286}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-http://keycloak:8080/realms/languagecards}
      Keycloak__AuthServerUrl: ${KEYCLOAK_AUTH_SERVER_URL:-http://keycloak:8080}
      KeycloakPublicClient__TokenEndpoint: ${KEYCLOAK_TOKEN_ENDPOINT:-http://keycloak:8080/realms/languagecards/protocol/openid-connect/token}
    networks:
      - passport

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: passport_keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      passport-mysql:
        condition: service_healthy
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8082}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: mysql
      KC_DB_URL_HOST: passport-mysql
      KC_DB_URL_PORT: "3306"
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    networks:
      - passport

  passport-mysql:
    image: mysql:8.4
    container_name: passport_mysql
    restart: unless-stopped
    ports:
      - "${PASSPORT_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      MYSQL_USER: ${KEYCLOAK_DB_USER:-keycloak}
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:-root_password}
    volumes:
      - passport-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - passport

networks:
  passport:
    name: passport
    external: true

volumes:
  passport-mysql-data:

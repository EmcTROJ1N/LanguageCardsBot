services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: infra_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - infra

  mysql-exporter-cards:
    image: prom/mysqld-exporter:latest
    container_name: infra_mysql_exporter_cards
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/mysql/my.cnf"
    ports:
      - "${MYSQL_EXPORTER_CARDS_PORT:-9104}:9104"
    volumes:
      - ./exporters/cards.my.cnf:/etc/mysql/my.cnf:ro
    networks:
      - infra
      - language-cards-shared

  mysql-exporter-passport:
    image: prom/mysqld-exporter:latest
    container_name: infra_mysql_exporter_passport
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/mysql/my.cnf"
    ports:
      - "${MYSQL_EXPORTER_PASSPORT_PORT:-9105}:9104"
    volumes:
      - ./exporters/passport.my.cnf:/etc/mysql/my.cnf:ro
    networks:
      - infra
      - passport

  node-exporter:
    image: prom/node-exporter:latest
    container_name: infra_node_exporter
    restart: unless-stopped
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - infra

  prometheus:
    image: prom/prometheus:latest
    container_name: infra_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - infra
      - passport

networks:
  infra:
    name: infra
    external: true
  language-cards-shared:
    name: language-cards-shared
    external: true
  passport:
    name: passport
    external: true

volumes:
  rabbitmq-data:
  prometheus-data:
